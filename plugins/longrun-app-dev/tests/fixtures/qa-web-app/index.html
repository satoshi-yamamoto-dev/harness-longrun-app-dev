<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Desk</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f5f8;color:#18212c;margin:0}main{max-width:760px;margin:48px auto;padding:24px}h1{font-size:36px;margin-bottom:8px}.intro{color:#4b5563}form{display:flex;gap:12px;margin-top:32px}input{flex:1;min-width:0;padding:12px;border:1px solid #7b8490;border-radius:6px}button{padding:12px;background:#204c91;color:white;border:0;border-radius:6px;cursor:pointer}li{display:flex;align-items:center;justify-content:space-between;gap:12px;background:white;padding:16px;margin-top:12px;border:1px solid #d1d5db;border-radius:8px}ul{list-style:none;padding:0}.done{text-decoration:line-through}button:focus-visible,input:focus-visible{outline:3px solid #c25200;outline-offset:3px}@media(max-width:480px){main{margin:12px auto;padding:16px}form{flex-direction:column}h1{font-size:28px}}
</style></head><body><main><h1>Task Desk</h1><p class="intro">Keep a small list of work and finish one task at a time.</p>
<form><label for="title">Task</label><input id="title" maxlength="80" required placeholder="What needs doing?"><button type="submit">Add task</button></form><p role="status" id="status">Ready</p><ul aria-label="Tasks"></ul></main>
<script>
const broken = __BROKEN__;
let tasks = JSON.parse(localStorage.getItem('task-desk') || '[]');
function render() {
  const list = document.querySelector('ul'); list.replaceChildren();
  for (const task of tasks) {
    const li = document.createElement('li'); const title = document.createElement('span');
    title.textContent = task.title; if(task.done) title.className='done';
    const button = document.createElement('button'); button.textContent = task.done ? 'Completed' : 'Complete'; button.disabled=task.done;
    if (!broken) button.onclick = () => { task.done=true; save(); render(); document.querySelector('#status').textContent='Task completed'; };
    li.append(title,button); list.append(li);
  }
}
function save() { if (!broken) localStorage.setItem('task-desk',JSON.stringify(tasks)); }
document.querySelector('form').onsubmit = event => { event.preventDefault(); const input=document.querySelector('#title'); const title=input.value.trim(); if(!title){document.querySelector('#status').textContent='Enter a task';return;} tasks.push({title,done:false});save();render();input.value='';document.querySelector('#status').textContent='Task added'; };
render();
</script></body></html>
